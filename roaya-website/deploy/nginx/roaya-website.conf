# nginx site config for roaya.co — production parity kit (TIFO-18)
#
# Reproduces the behaviors currently defined in roaya-website/vercel.json for a
# self-hosted SSH server. See docs/deploy/RUNBOOK.md for install steps and
# docs/deploy/vercel-nginx-mapping.md for the vercel.json -> nginx mapping table.
#
# Placeholders to fill in before use (search for __UPPER_SNAKE__):
#   __SERVER_NAME__        e.g. roaya.co
#   __WWW_SERVER_NAME__    e.g. www.roaya.co
#   __SSL_CERT_PATH__      e.g. /etc/letsencrypt/live/roaya.co/fullchain.pem
#   __SSL_KEY_PATH__       e.g. /etc/letsencrypt/live/roaya.co/privkey.pem
#   __BROWSER_DIST_PATH__  e.g. /var/www/roaya-website/dist/roaya-website/browser
#   __SSR_UPSTREAM_HOST__  e.g. 127.0.0.1
#   __SSR_UPSTREAM_PORT__  e.g. 4000 (matches PORT in the SSR systemd unit)

# Security header values below match vercel.json's global `headers` rule.
# CSP is intentionally NOT set (out of scope per Stage 1.1 decision).

# Upstream for the Angular SSR Node server (src/server.ts / dist/roaya-website/server/server.mjs)
upstream roaya_ssr {
    server __SSR_UPSTREAM_HOST__:__SSR_UPSTREAM_PORT__;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS (any host), preserving path and query string.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__ __WWW_SERVER_NAME__;

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. https://www.roaya.co/* -> https://roaya.co/* (301, permanent), matching
#    vercel.json's `redirects` rule exactly (host === "www.roaya.co" only).
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __WWW_SERVER_NAME__;

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    return 301 https://__SERVER_NAME__$request_uri;
}

# ---------------------------------------------------------------------------
# 3. Primary site: https://roaya.co
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    # Security headers — applied to every response from this server block,
    # including static files and the SSR proxy below. `always` ensures they
    # are also sent on error responses (e.g. the real Angular 404).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # -- AI/crawler + SEO files: served as static files with explicit content
    #    types, never proxied to the SSR app. These live in roaya-website/public/
    #    and are copied into the browser build output as-is.
    location = /robots.txt {
        root __BROWSER_DIST_PATH__;
        default_type "text/plain; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /sitemap.xml {
        root __BROWSER_DIST_PATH__;
        default_type "application/xml; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /llms.txt {
        root __BROWSER_DIST_PATH__;
        default_type "text/plain; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -- Hashed static assets from the Angular browser build (JS/CSS bundles,
    #    fonts, images). These have content-hashed filenames and are safe to
    #    cache aggressively. Falls through to the SSR proxy (404) if missing
    #    rather than serving a raw nginx 404, so unknown asset paths still
    #    get real app behavior.
    location ~* \.(?:js|css|mjs|map|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        root __BROWSER_DIST_PATH__;
        try_files $uri @ssr;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -- Everything else: proxy to the Angular SSR Node server so per-route
    #    SSR HTML, JSON-LD, bilingual metadata, and the real 404 status code
    #    are preserved. Do NOT add a static-only SPA fallback (try_files
    #    ... /index.html) here — that would silently strip SSR.
    location / {
        proxy_pass http://roaya_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @ssr {
        proxy_pass http://roaya_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
