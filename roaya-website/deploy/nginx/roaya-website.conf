# nginx site config for roaya.co — production parity kit (TIFO-18)
#
# Host-level behavior for the self-hosted production origin, which is the only
# deployment target for this project. See docs/deploy/RUNTIME-ENV.md for the
# SSR runtime contract, activation ordering, post-deploy verification and
# rollback. Host install steps and per-rule rationale are not yet written up;
# do not cite a runbook that does not exist.
#
# Placeholders to fill in before use (search for __UPPER_SNAKE__).
# Values below were verified against the live host on 2026-08-24:
#   __SERVER_NAME__        roaya.co
#   __WWW_SERVER_NAME__    www.roaya.co
#   __SSL_CERT_PATH__      /var/www/roaya-cert/www_roaya_co.crt
#   __SSL_KEY_PATH__       /var/www/roaya-cert/www.roaya.conopass.key
#                          (Sectigo commercial cert — EXPIRED 2026-05-01.
#                           Do NOT run certbot here. TLS renewal for this
#                           commercial cert is a manual, undocumented process.)
#   __BROWSER_DIST_PATH__  /var/www/roaya-ssr/current/browser
#   __BACKEND_PORT__       3001
#   __SSR_UPSTREAM_HOST__  127.0.0.1
#   __SSR_UPSTREAM_PORT__  4000 (must match PORT in the SSR supervisor config;
#                                confirmed free on the host)

# Security headers are repeated per-location on purpose: nginx's add_header does
# not inherit into a location that declares its own, so omitting them in a block
# silently drops the rest.
# CSP is intentionally NOT set (out of scope per Stage 1.1 decision).
#
# HSTS deliberately OMITS `includeSubDomains`. Verified 2026-08-24:
# api.roaya.co serves HTTP only (nginx `listen 80`, no TLS listener) and
# returns 200 over http://. With includeSubDomains, every browser that visited
# roaya.co would refuse plain HTTP to *.roaya.co for a full year — breaking any
# client that talks to http://api.roaya.co. HSTS is cached client-side, so this
# is NOT server-side reversible once shipped.
# Add includeSubDomains only after api.roaya.co (and every other subdomain)
# serves HTTPS. Omitting it costs nothing for crawlers or AI agents.

# Upstream for the Angular SSR Node server (src/server.ts / dist/roaya-website/server/server.mjs)
upstream roaya_ssr {
    server __SSR_UPSTREAM_HOST__:__SSR_UPSTREAM_PORT__;
    keepalive 32;
}

# ---------------------------------------------------------------------------
# 1. HTTP -> HTTPS (any host), preserving path and query string.
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__ __WWW_SERVER_NAME__;

    # -- ACME HTTP-01 challenge. Declared BEFORE the catch-all redirect and on
    #    port 80 on purpose: the challenge is fetched over plain HTTP, so it
    #    must not be redirected to HTTPS — especially while the origin cert is
    #    expired, which would make a redirected validation fail. `^~` stops the
    #    regex locations elsewhere from taking it. Carried over from the live
    #    host config; keeps a Let's Encrypt migration possible without another
    #    config change.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# 2. https://www.roaya.co/* -> https://roaya.co/* (301, permanent), matching
#    Applies to the www host only. NOTE: the live host currently serves both
#    hostnames without redirecting — see the canonical-host decision in
#    docs/deploy/RUNTIME-ENV.md before enabling this.
# ---------------------------------------------------------------------------
server {
    # HTTP/2 is enabled via the `listen` flag rather than the standalone
    # directive form, which was only added in nginx 1.25.1. This host runs
    # nginx 1.18 (verified 2026-08-24), where that form is an unknown
    # directive and fails `nginx -t` outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __WWW_SERVER_NAME__;

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    return 301 https://__SERVER_NAME__$request_uri;
}

# ---------------------------------------------------------------------------
# 3. Primary site: https://roaya.co
# ---------------------------------------------------------------------------
server {
    # HTTP/2 is enabled via the `listen` flag rather than the standalone
    # directive form, which was only added in nginx 1.25.1. This host runs
    # nginx 1.18 (verified 2026-08-24), where that form is an unknown
    # directive and fails `nginx -t` outright.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT_PATH__;
    ssl_certificate_key __SSL_KEY_PATH__;

    # Security headers — applied to every response from this server block,
    # including static files and the SSR proxy below. `always` ensures they
    # are also sent on error responses (e.g. the real Angular 404).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 10m;

    # -- AI/crawler + SEO files: served as static files with explicit content
    #    types, never proxied to the SSR app. These live in roaya-website/public/
    #    and are copied into the browser build output as-is.
    location = /robots.txt {
        root __BROWSER_DIST_PATH__;
        # Empty `types` block clears the inherited mime.types map for this
        # location. Without it `default_type` is inert: nginx resolves .txt/.xml
        # from mime.types (text/plain, text/xml) and never consults it.
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /sitemap.xml {
        root __BROWSER_DIST_PATH__;
        # Empty `types` block clears the inherited mime.types map for this
        # location. Without it `default_type` is inert: nginx resolves .txt/.xml
        # from mime.types (text/plain, text/xml) and never consults it.
        types { }
        default_type "application/xml; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /llms.txt {
        root __BROWSER_DIST_PATH__;
        # Empty `types` block clears the inherited mime.types map for this
        # location. Without it `default_type` is inert: nginx resolves .txt/.xml
        # from mime.types (text/plain, text/xml) and never consults it.
        types { }
        default_type "text/plain; charset=utf-8";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -- Backend API. MUST be declared before `location /` takes effect for
    #    these paths (nginx prefix-matching picks the longest match, so this
    #    wins over `/`). environment.prod.ts sets apiUrl to the relative path
    #    `/api/v1`, so every browser API call arrives here. Mirrors the live
    #    production config on the host as of 2026-08-24; without this block the
    #    SSR Node process would receive API requests and answer them with the
    #    app's own HTML, breaking the contact form, logos and testimonials.
    #    `^~` matters: it stops nginx from letting the static-asset regex
    #    location below win for any API path ending in an asset-like
    #    extension. The backend serves no static files today, but without
    #    `^~` a future upload/image endpoint under /api/ would be silently
    #    routed to the browser dist root instead of the API.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -- Hashed static assets from the Angular browser build (JS/CSS bundles,
    #    fonts, images). These have content-hashed filenames and are safe to
    #    cache aggressively. Falls through to the SSR proxy (404) if missing
    #    rather than serving a raw nginx 404, so unknown asset paths still
    #    get real app behavior.
    location ~* \.(?:js|css|mjs|map|woff2?|ttf|eot|otf|png|jpe?g|gif|svg|webp|avif|ico)$ {
        root __BROWSER_DIST_PATH__;
        try_files $uri @ssr;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    # -- Everything else: proxy to the Angular SSR Node server so per-route
    #    SSR HTML, JSON-LD, bilingual metadata, and the real 404 status code
    #    are preserved. Do NOT add a static-only SPA fallback (try_files
    #    ... /index.html) here — that would silently strip SSR.
    location / {
        proxy_pass http://roaya_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location @ssr {
        proxy_pass http://roaya_ssr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
